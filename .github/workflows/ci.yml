# ---------------------------------------------------------------------------
# Continuous Integration for the LC-3 Virtual Machine.
#
# Runs on every push and pull request. Three independent jobs run in parallel:
#   1. build      - `make` + a smoke run
#   2. sanitizers - `make sanitize` + a smoke run under ASan/UBSan
#   3. tidy       - clang-tidy static analysis (reports findings)
#
# Every job uses the project's own makefile targets, the same commands you run
# locally. A job fails if any step exits non-zero, which marks the commit red.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # =========================================================================
  build:
    name: Build & smoke test (GCC 15, C++23)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The build pins g++-15, which is not preinstalled; add it.
      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15
          g++-15 --version

      # `make` == the default target: cmake configure + build into out/.
      - name: Build
        run: make

      # Smoke test: a 4-byte LC-3 image that loads at 0x3000 and immediately
      # executes TRAP HALT (0xF025). The VM must run it and exit 0.
      - name: Smoke test (runs a HALT image)
        run: |
          printf '\x30\x00\xf0\x25' > images/halt.obj
          ./out/executableBinary halt < /dev/null
          echo "exit code: $?"

  # =========================================================================
  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 15
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15

      # `make sanitize` builds ./vm_san with the sanitizers switched on.
      - name: Build sanitized binary
        run: make sanitize

      - name: Run under sanitizers (must be clean)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1   # any undefined behavior fails the job
        run: |
          printf '\x30\x00\xf0\x25' > images/halt.obj
          ./vm_san halt < /dev/null

  # =========================================================================
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15 clang-tidy

      # `make` also writes out/compile_commands.json (your CMakeLists exports it).
      # clang-tidy reads it via -p to analyze with the real build flags.
      - name: Build (for compile_commands.json)
        run: make

      # Reports findings without failing the workflow. `continue-on-error: true`
      # lets this step's exit code be non-zero (clang-tidy returns non-zero on any
      # error-level diagnostic) while the job and the commit stay green.
      # To make clang-tidy a hard gate instead, delete continue-on-error and add
      # --warnings-as-errors='*' to the command.
      - name: Run clang-tidy
        continue-on-error: true
        run: clang-tidy -p out $(find src include -name '*.cpp' -o -name '*.h')

  # =========================================================================
  windows:
    name: Windows build & smoke test (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No compiler install: windows-latest ships MSVC and CMake. The CMakeLists
      # only pins g++-15 on non-Windows hosts, so here CMake picks MSVC.
      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      # Same HALT smoke test as Linux, written in PowerShell (the default shell).
      - name: Smoke test (runs a HALT image)
        run: |
          [IO.File]::WriteAllBytes("images/halt.obj", [byte[]](0x30,0x00,0xF0,0x25))
          ./build/Release/executableBinary.exe halt
          if ($LASTEXITCODE -ne 0) { exit 1 }
